# Checks WHATS-CHANGED.md and the What's changed page on every pull request
# (BetaNYC's What's changed standard). Build only; it never deploys or runs the pipeline.
#
# web/scripts/whats_changed.py is a copy of a shared BetaNYC file: never edit it here.
# It lives under web/ because pipeline.yml re-runs the R pipeline for changes in scripts/.
# `check --base-ref` needs the base branch's history (fetch-depth: 0), because old
# entries are append-only. `render --check` fails when web/public/whats-changed.html no
# longer matches WHATS-CHANGED.md; rebuild it with the same command without --check.
# Vite copies web/public/ into the deployed site as-is. Standard library only.
name: What's changed

on:
  pull_request:

permissions:
  contents: read

jobs:
  whats-changed:
    name: What's changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WHATS-CHANGED.md
        run: python3 web/scripts/whats_changed.py check WHATS-CHANGED.md --base-ref "origin/${{ github.base_ref }}"

      - name: The What's changed page matches the file
        run: >-
          python3 web/scripts/whats_changed.py render WHATS-CHANGED.md --format page
          --out web/public/whats-changed.html
          --site-name "District 26 Green Infrastructure Web Map" --home-url ./
          --repo-url https://github.com/BetaNYC/d26-gi-web-map --check

      - name: The map's footer links to the What's changed page
        run: grep -q 'whats-changed.html' web/src/components/Footer.svelte
